function norm(s){ if(!s)return ""; var t=s+""; t=t.replace(/İ/g,"i").replace(/I/g,"i"); t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,""); t=t.toLowerCase(); t=t.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c"); return t; }
function cleanName(s){ if(!s)return ""; var t=norm(s); t=t.replace(/\btr\b/g,"").replace(/[^a-z0-9]/g,""); return t; }
function getTypeByGroup(g,url,raw,tvgId){
  var n=norm(g+" "+(tvgId||"")); var r=(raw||"").toLowerCase();

function parseM3U(t){
  var list=[]; var seenGroup={}; var cur=null, curLine="", curId="", curTitle="", curUA=""; var newOrder=[];

  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(!l) continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; curLine=l; curUA=""; var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo) cur.logo=lo[1];

      var gr=l.match(/group-title="([^"]+)"/i); cur.group=gr?gr[1].trim():"Genel";
      var ua=l.match(/http-user-agent="([^"]+)"/i); if(ua) curUA=ua[1];
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1); curTitle=cur.title;
      if(!seenGroup[cur.group]){seenGroup[cur.group]=1; newOrder.push(cur.group);}
    } else if(l.toUpperCase().indexOf("#EXTVLCOPT:")==0){
      var um=l.match(/http-user-agent=(.+)/i); if(um){ curUA=um[1].replace(/^"/,"").replace(/"$/,"").trim(); }

        var url=l.split("|")[0].trim().split(/\s+/)[0];
        cur.url=url; cur.userAgent=curUA||""; cur.type=getTypeByGroup(cur.group, url, curLine, curId); list.push(cur); cur=null;

  groupOrder=newOrder;

}
