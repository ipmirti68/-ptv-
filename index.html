<style>

.posterImg img{width:100%;height:100%;object-fit:contain;display:block;background:#0d1525}
.posterTitle{padding:8px 10px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#121e33;font-weight:800;height:70px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.posterTitle small{font-size:9px;color:#7ec8ff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.favBtnCard{position:absolute;top:8px;right:8px;width:32px;height:32px;background:rgba(0,0,0,.75);border-radius:50%;border:none;color:#888;font-size:18px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.favBtnCard.on{color:#ffcc33}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99}
.box{background:#101b30;border:1px solid #22365e;width:360px;max-width:92vw;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box input{background:#0a1222;border:1px solid #22365e;color:#fff;padding:8px;border-radius:6px;width:100%;font-size:11px}
#speedModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center}
.speedBox{background:#fff;color:#111;width:360px;max-width:92vw;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.speedVal{font-size:42px;font-weight:300;color:#111;margin-top:-10px}
@media(max-width:380px){#grid.live{grid-template-columns:1fr;grid-auto-rows:76px}}
</style>
</head>

<script>
var M3U_URLS=[
"https://cdn.jsdelivr.net/gh/ipmirti68/-p@main/m%C4%B1rt%C4%B168.m3u",
"https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/m%C4%B1rt%C4%B168.m3u",
"https://api.allorigins.win/raw?url=https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/m%C4%B1rt%C4%B168.m3u"
];
var EPG_URL="https://raw.githubusercontent.com/ipmirti68/epg/refs/heads/main/epg.xml";
var DEFAULT_LOGO="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
var SPEED_TEST_URL="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
var channels=[],epg={},curGroup=null,curTab="live",hls=null,groupOrder=[],favs=[],curCh=null;
try{favs=JSON.parse(localStorage.getItem("mirti_fav")||"[]");}catch(e){favs=[];}

function $(id){return document.getElementById(id);}
function setLoad(p,t){ var f=$("loadFill"), tx=$("loadText"); if(f)f.style.width=p+"%"; if(tx)tx.textContent="%"+p+" "+t; var en=$("epgNow"); if(en)en.textContent=t; }
function saveFav(){try{localStorage.setItem("mirti_fav",JSON.stringify(favs));}catch(e){}}
function isFav(url){return favs.indexOf(url)!=-1;}
function toggleFav(url){ var i=favs.indexOf(url); if(i==-1)favs.push(url); else favs.splice(i,1); saveFav(); renderGrid(); renderGroups(); }
function norm(s){
  if(!s)return "";
  var t=s+""; t=t.replace(/İ/g,"i").replace(/I/g,"i");
  t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  t=t.toLowerCase();
  t=t.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
  return t;
}
function getTypeByGroup(g,url){
  var n=norm(g);
  // 1. SİNEMA = CANLI senin istediğin
  if(n.indexOf("sinema")!=-1) return "live";
  // 2. DİZİ = DİZİ
  if(n.indexOf("yerli dizi")!=-1) return "series";
  if(n.indexOf("guncel dizi")!=-1) return "series";
  if(n.indexOf("guncel diziler")!=-1) return "series";
  if(n.indexOf("dizi")!=-1) return "series";
  if(n.indexOf("sezon")!=-1) return "series";
  if(n.indexOf("bolum")!=-1) return "series";
  if(n.indexOf("series")!=-1) return "series";
  // 3. FİLM = FİLM (sinema hariç)
  if(n.indexOf("film")!=-1) return "movie";
  if(n.indexOf("movie")!=-1) return "movie";
  if(n.indexOf("vod")!=-1) return "movie";
  if(n.indexOf("sineturk")!=-1) return "movie";
  if(n.indexOf("yesilcam")!=-1) return "movie";
  if(n.indexOf("turk filmi")!=-1) return "movie";
  if(n.indexOf("kemal")!=-1 && n.indexOf("sunal")!=-1) return "movie";
  // mp4 mkv ve dizi/sinema değilse film
  var u=(url||"").toLowerCase();
  if((u.indexOf(".mp4")!=-1 || u.indexOf(".mkv")!=-1) && n.indexOf("dizi")==-1 && n.indexOf("sinema")==-1) return "movie";
  return "live";
}
function parseM3U(t){
  var list=[]; var seen={}; groupOrder=[];
  t=t.replace(/\r/g,"");
  var lines=t.split("\n");
  var cur=null, curLine="";
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l)continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; curLine=l;
      var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo)cur.logo=lo[1];
      var id=l.match(/tvg-id="([^"]+)"/i); if(id)cur.tvgId=id[1];
      var gr=l.match(/group-title="([^"]+)"/i); cur.group=gr?gr[1].trim():"Genel";
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1);
      if(!seen[cur.group]){seen[cur.group]=1; groupOrder.push(cur.group);}
    }else{
      if(cur && l.charAt(0)!="#"){
        var url=l.split("|")[0].trim();
        cur.url=url;
        cur.type=getTypeByGroup(cur.group, url);
        cur.rawLine=curLine;
        list.push(cur); cur=null; curLine="";
      }
    }
  }
  return list;
}
function parseEPG(xmlText){
  try{
    var p=new DOMParser(), d=p.parseFromString(xmlText,"text/xml"), m={};
    var progs=d.querySelectorAll("programme");
    progs.forEach(function(pr){
      var ch=pr.getAttribute("channel");
      var st=pr.getAttribute("start");
      var en=pr.getAttribute("stop");
      var ti=pr.querySelector("title"); var title=ti?ti.textContent:"";
      if(!m[ch])m[ch]=[];
      m[ch].push({title:title,start:st,stop:en});
    });
    for(var k in m){ m[k].sort(function(a,b){ if(!a.start||!b.start)return 0; return a.start.localeCompare(b.start); }); }
    return m;
  }catch(e){return {};}
}
function parseEPGDate(s){
  if(!s)return null;
  try{ var y=s.substr(0,4), mo=s.substr(4,2)-1, d=s.substr(6,2), h=s.substr(8,2), mi=s.substr(10,2), sec=s.substr(12,2); return new Date(y,mo,d,h,mi,sec); }catch(e){return null;}
}
function getEPGNowNext(ch){
  if(!ch)return {now:null,next:null};
  var list=null;
  if(ch.tvgId && epg[ch.tvgId])list=epg[ch.tvgId];
  else if(epg[ch.title])list=epg[ch.title];
  else{ var low=norm(ch.title); for(var k in epg){if(norm(k)==low){list=epg[k];break;}} }
  if(!list||!list.length)return {now:null,next:null};
  var now=new Date();
  var nowProg=null,nextProg=null;
  for(var i=0;i<list.length;i++){
    var p=list[i]; var st=parseEPGDate(p.start); var en=parseEPGDate(p.stop);
    if(st&&en){ if(now>=st&&now<en){nowProg=p; if(i+1<list.length)nextProg=list[i+1]; break;} if(now<st && !nowProg){nextProg=p; if(i>0)nowProg=list[i-1]; break;} }
    else{ if(i==0)nowProg=p; if(i==1)nextProg=p; }
  }
  if(!nowProg&&list.length){nowProg=list[0]; if(list.length>1)nextProg=list[1];}
  return {now:nowProg,next:nextProg};
}
function getFiltered(){
  var list=[];
  for(var i=0;i<channels.length;i++){ var c=channels[i]; if(curTab=="fav"){if(isFav(c.url))list.push(c);} else if(c.type==curTab)list.push(c); }
  if(curGroup){ var f=[]; for(var j=0;j<list.length;j++) if(list[j].group==curGroup)f.push(list[j]); list=f; }
  var q=$("search").value.toLowerCase(); if(q){var f2=[]; for(var k=0;k<list.length;k++) if(list[k].title.toLowerCase().indexOf(q)!=-1)f2.push(list[k]); list=f2;}
  return list;
}
function renderGroups(){
  var gl=$("groups"); if(!gl)return; gl.innerHTML="";
  for(var i=0;i<groupOrder.length;i++){
    var g=groupOrder[i];
    var has=false, cnt=0;
    for(var j=0;j<channels.length;j++){ if(channels[j].group==g){ if(curTab=="fav"){if(isFav(channels[j].url)){has=true;cnt++;}} else if(channels[j].type==curTab){has=true;cnt++;} } }
    if(!has)continue;
    var div=document.createElement("div"); div.className="gChip"+(g==curGroup?" on":""); div.textContent=g+" "+cnt;
    div.onclick=(function(gg){return function(){curGroup=gg; renderGrid(); renderGroups();};})(g);
    gl.appendChild(div);
  }
  setTimeout(function(){var el=document.querySelector(".gChip.on"); if(el)el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});},200);
}
function renderGrid(){
  var grid=$("grid"); if(!grid)return; grid.innerHTML="";
  var list=getFiltered();
  if(list.length==0 && channels.length==0){ var d=document.createElement("div"); d.style.cssText="color:#ff9a3d;padding:20px;text-align:center;font-size:12px"; d.textContent="Liste boş - AYAR'a bas"; grid.appendChild(d); return; }
  if(list.length==0 && curTab=="fav"){ var d2=document.createElement("div"); d2.style.cssText="color:#888;padding:20px;text-align:center;font-size:12px"; d2.textContent="Fav yok - ☆ tıkla"; grid.appendChild(d2); return; }
  if(curTab=="movie" || curTab=="series"){
    grid.className="poster";
    for(var i=0;i<list.length;i++){
      var ch=list[i]; var card=document.createElement("div"); card.className="posterCard";
      var p=document.createElement("div"); p.className="posterImg";
      var img=document.createElement("img"); img.src=ch.logo ? ch.logo : DEFAULT_LOGO; img.loading="lazy"; img.onerror=function(){this.onerror=null; this.src=DEFAULT_LOGO;}; p.appendChild(img);
      var favBtn=document.createElement("button"); favBtn.className="favBtnCard"+(isFav(ch.url)?" on":""); favBtn.textContent=isFav(ch.url)?"★":"☆"; favBtn.onclick=(function(url){return function(ev){ev.stopPropagation(); toggleFav(url);};})(ch.url); p.appendChild(favBtn);
      var m=document.createElement("div"); m.className="posterTitle";
      var epgNN=getEPGNowNext(ch); var t1=document.createElement("div"); t1.textContent=ch.title; var t2=document.createElement("small"); if(epgNN.now)t2.textContent="Şimdi: "+epgNN.now.title; else if(epgNN.next)t2.textContent="Sonra: "+epgNN.next.title; else t2.textContent=ch.group; m.appendChild(t1); m.appendChild(t2);
      card.appendChild(p); card.appendChild(m); card.onclick=(function(c){return function(){play(c);};})(ch); grid.appendChild(card);
    }
  }else{
    grid.className="live";
    for(var j=0;j<list.length;j++){
      var ch2=list[j]; var row=document.createElement("div"); row.className="item"+(curCh && curCh.url==ch2.url?" on":""); if(ch2.group && norm(ch2.group).indexOf("ulusal")!=-1)row.className+=" ulusal";
      var logoBox=document.createElement("div"); logoBox.className="logoBox"; var img2=document.createElement("img"); img2.src=ch2.logo ? ch2.logo : DEFAULT_LOGO; img2.onerror=function(){this.onerror=null; this.src=DEFAULT_LOGO;}; logoBox.appendChild(img2);
      var info=document.createElement("div"); info.className="info"; var b=document.createElement("b"); b.textContent=ch2.title; var s=document.createElement("span"); var epgNN2=getEPGNowNext(ch2); if(epgNN2.now)s.textContent="Şimdi: "+epgNN2.now.title; else s.textContent=ch2.group; var nxt=document.createElement("span"); nxt.className="next"; if(epgNN2.next)nxt.textContent="Sonra: "+epgNN2.next.title; else nxt.textContent=""; info.appendChild(b); info.appendChild(s); if(nxt.textContent)info.appendChild(nxt);
      var favBtn2=document.createElement("button"); favBtn2.className="favBtn"+(isFav(ch2.url)?" on":""); favBtn2.textContent=isFav(ch2.url)?"★":"☆"; favBtn2.onclick=(function(url){return function(ev){ev.stopPropagation(); toggleFav(url);};})(ch2.url);

var channels=[],epg={},epgNorm={},curGroup=null,curTab="live",hls=null,hlsAudio=null,groupOrder=[],favs=[],curCh=null,isFS=false,fsListOpen=false,curVol=0.8,touchStartX=0,touchStartY=0;

function norm(s){ if(!s)return ""; var t=s+""; t=t.replace(/İ/g,"i").replace(/I/g,"i"); t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,""); t=t.toLowerCase(); t=t.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c"); return t; }
function cleanName(s){ if(!s)return ""; var t=norm(s); t=t.replace(/\btr\b/g,"").replace(/[^a-z0-9]/g,""); return t; }
function getTypeByGroup(g,url,raw,tvgId,title){
  var n=norm(g+" "+(tvgId||"")+" "+(title||""));
  var r=(raw||"").toLowerCase();
  if(r.indexOf('radio="true"')!=-1 || r.indexOf("radio=")!=-1){
    if(n.indexOf("goruntulu")!=-1) return "live";
    return "radio";
  }
  if(tvgId && norm(tvgId).indexOf("radyo")==0){
    if(n.indexOf("goruntulu")!=-1) return "live";

  }
  if(n.indexOf("muzik")!=-1 && r.indexOf('radio="true"')==-1) return "live";
  if(n.indexOf("music")!=-1 && r.indexOf('radio="true"')==-1) return "live";
  if(n.indexOf("sinema")!=-1) return "live";

  if(n.indexOf("dizi")!=-1) return "series";
  if(n.indexOf("sezon")!=-1) return "series";
  if(n.indexOf("bolum")!=-1) return "series";
  if(n.indexOf("series")!=-1) return "series";
  if(n.indexOf("film")!=-1) return "movie";
  if(n.indexOf("movie")!=-1) return "movie";
  if(n.indexOf("vod")!=-1) return "movie";
  if(n.indexOf("sineturk")!=-1) return "movie";
  if(n.indexOf("yesilcam")!=-1) return "movie";
  if(n.indexOf("turk filmi")!=-1) return "movie";
  if(n.indexOf("kemal")!=-1 && n.indexOf("sunal")!=-1) return "movie";
  var u=(url||"").toLowerCase();
  if((u.indexOf(".mp4")!=-1 || u.indexOf(".mkv")!=-1) && n.indexOf("dizi")==-1 && n.indexOf("sinema")==-1 && n.indexOf("radyo")==-1) return "movie";
  return "live";
}
function parseM3U(t){
  var list=[]; var seen={}; groupOrder=[];
  t=t.replace(/\r/g,""); var lines=t.split("\n"); var cur=null, curLine="", curId="", curTitle="";
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim(); if(!l)continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; curLine=l;
      var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo)cur.logo=lo[1];
      var id=l.match(/tvg-id="([^"]+)"/i); if(id){cur.tvgId=id[1]; curId=id[1];} else curId="";
      var gr=l.match(/group-title="([^"]+)"/i); cur.group=gr?gr[1].trim():"Genel";
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1); curTitle=cur.title;
      if(!seen[cur.group]){seen[cur.group]=1; groupOrder.push(cur.group);}
    }else{
      if(cur && l.charAt(0)!="#"){
        var rawUrl=l.trim(); var url=rawUrl.split(/\s+/)[0].split("|")[0].trim();
        cur.url=url; cur.type=getTypeByGroup(cur.group, url, curLine, curId, curTitle); cur.rawLine=curLine+" "+rawUrl;
        list.push(cur); cur=null; curLine=""; curId=""; curTitle="";
      }
    }
  }
  return list;
}
function parseEPG(xmlText){
  try{
    var p=new DOMParser(), d=p.parseFromString(xmlText,"text/xml"), m={}, mn={};
    var progs=d.querySelectorAll("programme");
    progs.forEach(function(pr){
      var ch=pr.getAttribute("channel"); var st=pr.getAttribute("start"); var en=pr.getAttribute("stop");
      var ti=pr.querySelector("title"); var title=ti?ti.textContent:"";
      if(!m[ch])m[ch]=[]; m[ch].push({title:title,start:st,stop:en});
      var cn=cleanName(ch); if(cn && !mn[cn]) mn[cn]=ch;
    });
    for(var k in m){ m[k].sort(function(a,b){ if(!a.start||!b.start)return 0; return a.start.localeCompare(b.start); }); }
    epgNorm=mn; return m;
  }catch(e){return {};}
}
function parseEPGDate(s){ if(!s)return null; try{ var y=s.substr(0,4), mo=s.substr(4,2)-1, d=s.substr(6,2), h=s.substr(8,2), mi=s.substr(10,2), sec=s.substr(12,2); return new Date(y,mo,d,h,mi,sec); }catch(e){return null;} }
function getEPGNowNext(ch){
  if(!ch)return {now:null,next:null,found:false}; var list=null;
  if(ch.tvgId && epg[ch.tvgId]){ list=epg[ch.tvgId]; }
  if(!list && epg[ch.title]){ list=epg[ch.title]; }
  if(!list){ var cn=cleanName(ch.title); if(cn && epgNorm[cn] && epg[epgNorm[cn]]){ list=epg[epgNorm[cn]]; } }
  if(!list){ var low=norm(ch.title); for(var k in epg){ var nk=norm(k); if(nk.indexOf(low)!=-1 || low.indexOf(nk)!=-1){ list=epg[k]; break; } } }
  if(!list||!list.length)return {now:null,next:null,found:false};
  var now=new Date(); var nowProg=null,nextProg=null;
  for(var i=0;i<list.length;i++){ var p=list[i]; var st=parseEPGDate(p.start); var en=parseEPGDate(p.stop); if(st&&en){ if(now>=st&&now<en){nowProg=p; if(i+1<list.length)nextProg=list[i+1]; break;} if(now<st && !nowProg){nextProg=p; if(i>0)nowProg=list[i-1]; break;} } else{ if(i==0)nowProg=p; if(i==1)nextProg=p; } }
  if(!nowProg&&list.length){nowProg=list[0]; if(list.length>1)nextProg=list[1];}
  return {now:nowProg,next:nextProg,found:true};
}
function getFiltered(){ var list=[]; for(var i=0;i<channels.length;i++){ var c=channels[i]; if(curTab=="fav"){if(isFav(c.url))list.push(c);} else if(c.type==curTab)list.push(c); } if(curGroup){ var f=[]; for(var j=0;j<list.length;j++) if(list[j].group==curGroup)f.push(list[j]); list=f; } return list; }
function renderGroups(){

  if(curTab=="radio"){

function playWithUrl(a, url, ch){
  if(url.indexOf(".m3u8")!=-1){

          var prox="https://api.allorigins.win/raw?url="+encodeURIComponent(url);
          $("epgNow").textContent="Proxy deneniyor..."; if(hlsAudio){try{hlsAudio.destroy();}catch(e){}} setTimeout(function(){ playWithUrl(a, prox, ch); },500);
        }
      });
    }else{ a.src=url; a.play().catch(function(e){ $("epgNow").textContent="Play hata: "+e.message; }); }
  }else{ a.src=url; a.play().catch(function(e){ $("epgNow").textContent="Play hata: "+e.message; }); }

}
function findUlusalGroup(){ for(var i=0;i<groupOrder.length;i++){ var g=groupOrder[i]; if(norm(g).indexOf("ulusal")!=-1)return g; } return null; }
function changeChannel(offset){
  var list=getFiltered(); if(!list.length) return;
  if(!curCh){ play(list[0]); return; }
  var idx=-1; for(var i=0;i<list.length;i++){ if(list[i].url==curCh.url){ idx=i; break; } }
  if(idx==-1) idx=0;
  var newIdx=idx+offset;
  if(newIdx<0) newIdx=list.length-1;
  if(newIdx>=list.length) newIdx=0;
  play(list[newIdx]);
  if(isFS){ renderFsGrid(); var fsGrid=$("fsGrid"); if(fsGrid){ var el=fsGrid.children[newIdx]; if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); } }

function changeVolume(delta){
  curVol+=delta; if(curVol<0) curVol=0; if(curVol>1) curVol=1;

function measureSpeed(url){ return new Promise(function(resolve,reject){ var start=performance.now(); fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error("HTTP "+r.status); return r.blob(); }).then(function(blob){ var end=performance.now(); var durationMs=end-start; var durationSec=durationMs/1000; if(durationSec<0.01)durationSec=0.01; var bytes=blob.size; var mbps=(bytes*8/1000000)/durationSec; resolve({mbps:mbps,ms:durationMs,bytes:bytes}); }).catch(function(e){reject(e);}); }); }
function doSpeedTest(){ var arc=$("arc"), needle=$("needle"), num=$("speedNum"), pingEl=$("pingVal"), downEl=$("downVal"), sizeEl=$("sizeVal"), infoEl=$("speedInfo"); if(!arc)return; num.textContent="..."; pingEl.textContent="..."; downEl.textContent="..."; if(sizeEl)sizeEl.textContent="..."; if(infoEl)infoEl.textContent="Ölçülüyor..."; measureSpeed(SPEED_TEST_URL).then(function(res){ var mbps=res.mbps; pingEl.textContent=Math.round(res.ms); downEl.textContent=mbps.toFixed(1); if(sizeEl)sizeEl.textContent=Math.round(res.bytes/1024)+" KB"; num.textContent=mbps.toFixed(2); if(infoEl)infoEl.textContent="Gerçek: "+Math.round(res.bytes/1024)+" KB "+Math.round(res.ms)+"ms"; $("netSpeed").textContent="Net: "+mbps.toFixed(1)+" Mbps"; var pct=Math.min(mbps,100); var dash=251-pct/100*251; arc.style.strokeDashoffset=dash; var angle=-90+ (pct/100*180); var rad=angle*Math.PI/180; var x=100+60*Math.cos(rad); var y=100+60*Math.sin(rad); needle.setAttribute("x2",x); needle.setAttribute("y2",y); }).catch(function(e){ pingEl.textContent="hata"; if(infoEl)infoEl.textContent="Hata: "+e.message; num.textContent="0.00"; }); }
function loadM3UFromUrls(idx){ if(idx==null)idx=0; if(idx>=M3U_URLS.length){ setLoad(0,"Tüm linkler başarısız"); $("modal").classList.remove("hidden"); return; } var url=M3U_URLS[idx]; setLoad(5+Math.floor(idx/M3U_URLS.length*30),"Deneniyor "+(idx+1)+"/"+M3U_URLS.length); fetch(url,{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error("HTTP "+r.status); return r.text(); }).then(function(t){ if(t.length<100)throw new Error("boş "+t.length); setLoad(50,t.length+" bayt"); channels=parseM3U(t); if(channels.length==0)throw new Error("0 kanal"); var ul=findUlusalGroup(); if(ul){curGroup=ul; setLoad(70,"Ulusal: "+ul+" - "+channels.length+" kanal");} else{curGroup=groupOrder[0]; setLoad(70,channels.length+" kanal");} renderGroups(); renderGrid(); setLoad(80,"EPG yükleniyor..."); fetch(EPG_URL).then(function(re){return re.text();}).then(function(xe){ epg=parseEPG(xe); var keys=Object.keys(epg); setLoad(100,keys.length+" EPG | "+channels.length+" kanal - v71 kumanda"); setTimeout(function(){var lw=$("loadWrap"); if(lw)lw.style.display="none";},800); renderGrid(); }).catch(function(e){setLoad(90,channels.length+" kanal"); renderGrid(); var lw=$("loadWrap"); if(lw)lw.style.display="none";}); }).catch(function(e){ setLoad(3,"Link "+(idx+1)+" hata: "+e.message); setTimeout(function(){loadM3UFromUrls(idx+1);},300); }); }
function toggleFS(){
  var pc=$("playerCol"); isFS=!isFS;

    if(!isFS) return;

    // Eğer liste içindeki item'e tıklandıysa click zaten handle ediliyor, burası video alanı
    if(e.target.closest && e.target.closest("#fsChannelList")) return;
    var fsList=$("fsChannelList");
    if(!fsList) return;
    if(fsListOpen){ fsList.classList.remove("show"); fsListOpen=false; }
    else{ renderFsGrid(); fsList.classList.add("show"); fsListOpen=true; }
  });
  // Çift tık tam ekran
  player.addEventListener("dblclick", function(e){ toggleFS(); });
  // Klavye: sağ-sol kanal, yukarı-aşağı ses
  document.addEventListener("keydown", function(e){
    if(!isFS && curTab!="live") return; // sadece canlıda veya tam ekranda çalışsın

    else if(e.key=="ArrowLeft"){ e.preventDefault(); changeChannel(-1); }

  });

  player.addEventListener("touchend", function(e){

  var tabs=document.querySelectorAll(".top button");

    var newTab=btn.dataset.tab; if(curCh && curCh.type=="radio" && newTab!="radio" && newTab!="fav"){ stopRadio(); }
    for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on"); btn.classList.add("on"); curTab=newTab; if(curTab=="live"){var ul=findUlusalGroup(); if(ul)curGroup=ul; else curGroup=null;} else curGroup=null; renderGroups(); renderGrid();
  };})(tabs[i])); }
  $("loadBtn").onclick=function(){ var m3u=$("m3uIn").value.trim(); if(m3u){ setLoad(20,"Elle yükleniyor..."); fetch(m3u).then(function(r){return r.text();}).then(function(t){ var add=parseM3U(t); channels=add; var ul=findUlusalGroup(); if(ul)curGroup=ul; renderGroups(); renderGrid(); setLoad(100,add.length+" kanal"); $("modal").classList.add("hidden"); var lw=$("loadWrap"); if(lw)lw.style.display="none"; }).catch(function(e){$("stat").textContent="Hata: "+e.message;}); } };
  $("fileIn").addEventListener("change",function(e){ var file=e.target.files[0]; if(!file)return; var reader=new FileReader(); reader.onload=function(ev){ var txt=ev.target.result; if(file.name.endsWith(".xml")){var newEpg=parseEPG(txt); for(var k in newEpg)epg[k]=newEpg[k]; $("stat").textContent="EPG ok"; renderGrid();} else{var add=parseM3U(txt); channels=add; var ul=findUlusalGroup(); if(ul)curGroup=ul; renderGroups(); renderGrid(); setLoad(100,"Dosyadan "+add.length+" kanal"); $("modal").classList.add("hidden"); var lw=$("loadWrap"); if(lw)lw.style.display="none";} }; reader.readAsText(file); });
