<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirti TV - Radyo Mod</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#070b14;color:#e8e6df;font-family:Arial,sans-serif;overflow:hidden}
header{height:50px;background:#0f1726;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1e2a44}
.logo-area{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}.logo-area img{height:32px;border-radius:8px}
.topTabs{height:42px;background:#0d1525;display:flex;align-items:center;gap:5px;padding:0 8px;border-bottom:1px solid #1c2b4a;overflow:auto}
.topTabs button{background:#101c33;border:1px solid #1e2f52;color:#aab7d1;padding:6px 12px;border-radius:18px;cursor:pointer;font-size:12px;white-space:nowrap}
.topTabs button.active{background:#d4b78f;color:#111;font-weight:800}
#main{display:flex;height:calc(100vh - 92px)}
#sidebar{width:210px;background:#0d1525;border-right:1px solid #1c2b4a;padding:6px;display:flex;flex-direction:column;gap:6px;overflow:auto}
#groupList{display:flex;flex-direction:column;gap:3px}
.gitem{display:flex;justify-content:space-between;background:#101c33;border:1px solid #1e2f52;padding:6px 8px;border-radius:8px;font-size:11px;cursor:pointer}
.gitem.active{background:#d4b78f;color:#111;font-weight:700}
#epgInfo{background:#111d33;border-radius:8px;padding:6px;font-size:10px;min-height:40px}
#content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}
#playerWrap{position:relative;background:#000;height:42vh;min-height:220px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#video{width:100%;height:100%;display:none;object-fit:contain;background:#000;z-index:2}
#radioBg{position:absolute;inset:0;display:none;background-size:cover;background-position:center;z-index:1}
#radioBg::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.7) 0%,rgba(0,0,0,.2) 100%)}
#radioInfo{position:absolute;bottom:14px;left:14px;right:14px;z-index:3;color:#fff;text-shadow:0 2px 8px #000;display:none}
#radioInfo h2{font-size:18px;color:#d4b78f}#radioInfo p{font-size:12px;margin-top:4px;color:#e8dcc8}
#idleScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#0a1222;z-index:4}
#idleScreen img{width:160px;border-radius:12px}
#nowPlaying{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.75);padding:5px 8px;border-radius:7px;display:none;max-width:80%;font-size:11px;z-index:5}
#grid{display:grid;gap:6px;padding:8px;overflow:auto;background:#070b14;flex:1}
#grid.live{grid-template-columns:repeat(auto-fill,minmax(95px,1fr))}
#grid.movie,#grid.series{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
#grid.radio{grid-template-columns:repeat(auto-fill,minmax(95px,1fr))}
.card{background:#121e33;border:1px solid #1e2e51;border-radius:10px;overflow:hidden;cursor:pointer}
.card .poster{background:#0d1525;display:flex;align-items:center;justify-content:center;position:relative;aspect-ratio:1/1;overflow:hidden}
.card.movie .poster,.card.series .poster{aspect-ratio:2/3}
.card .poster img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:5px}.card .meta h4{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card .meta p{font-size:9px;color:#9bb0d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:3px;left:3px;background:#e11d48;color:#fff;font-size:7px;padding:2px 4px;border-radius:8px}
.hidden{display:none!important}
#settingsModal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#101b30;border:1px solid #22365e;width:480px;max-width:94vw;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.modal input{background:#0a1222;border:1px solid #22365e;color:#fff;padding:8px 10px;border-radius:8px;width:100%}
#loadBtn{background:#d4b78f;color:#111;border:none;padding:9px 12px;border-radius:8px;font-weight:800;cursor:pointer;flex:1}
#closeSettings{background:transparent;border:1px solid #33486f;color:#fff;padding:9px 12px;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<header>
<div class="logo-area"><img src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg"><span>Mirti TV</span></div>
<div style="display:flex;gap:5px"><input id="searchTop" placeholder="Ara..." style="background:#0a1222;border:1px solid #1e2f52;color:#fff;padding:6px 8px;border-radius:8px;width:110px"><button id="settingsBtn" style="background:#d4b78f;color:#111;border:none;padding:6px 10px;border-radius:8px;font-weight:800">Ayar</button></div>

<div id="radioInfo"><h2 id="radioTitle">Radyo</h2><p id="radioDesc">Radyo Dinlemek Bir Başka Güzel...</p><p style="font-size:10px;margin-top:8px;font-style:italic">İyi insanlar hiç ölmez... Bir zamanlar her şey daha güzeldi... Radyo hep vardı, her zaman...</p></div>
<div id="nowPlaying"></div>
</div>
<div id="grid" class="live"></div>
</section>
</div>
<div id="settingsModal" class="hidden"><div class="modal"><h2>Kaynak</h2><input id="m3uUrl" placeholder="Ek M3U"><input id="epgUrl" placeholder="EPG URL"><div style="display:flex;gap:5px"><button id="loadBtn">Yukle</button><button id="closeSettings">Kapat</button></div><div id="loadStatus" style="font-size:10px;color:#8fb0ff"></div></div></div>
