<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mirti TV v85</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#e8e6df;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:36px;background:#0f1726;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-bottom:1px solid #1e2a44}
.logo{font-weight:900;font-size:13px;display:flex;gap:6px;align-items:center}
.logo img{height:24px;width:24px;border-radius:4px}
.top{background:#0d1a33;display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid #1c2b4a;overflow:auto}
.top button{border:1px solid #2a5a9a;background:#1e3a5f;color:#c8d8ff;padding:6px 12px;border-radius:14px;font-size:11px;font-weight:800;white-space:nowrap;cursor:pointer;flex-shrink:0}
.top button.on{color:#fff;background:#ff3b30;border-color:#ff3b30}
.top button[data-tab=movie].on{background:#007aff;border-color:#007aff}
.top button[data-tab=series].on{background:#af52de;border-color:#af52de}
.top button[data-tab=radio].on{background:#ff9500;border-color:#ff9500;color:#111}
.top button[data-tab=fav].on{background:#ffcc00;border-color:#ffcc00;color:#111}
#playerCol{height:42vh;min-height:220px;background:#000;display:flex;flex-direction:column}
#player{flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
#video{width:100%;height:100%;object-fit:contain;background:#000}
#idle{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center}
#idle img{width:100%;height:100%;object-fit:cover}
#epgBar{height:24px;background:#101c33;padding:0 8px;font-size:11px;display:flex;align-items:center;border-top:1px solid #1c2b4a;white-space:nowrap;overflow:hidden}
#groupsWrap{height:42px;background:#0f2440;border-bottom:1px solid #2a5a9a;display:flex;align-items:center;padding:0 8px;gap:6px}
#groups{flex:1;display:flex;gap:6px;overflow:auto}
.gChip{padding:6px 14px;background:#1e3a5f;border:1px solid #2a5a9a;border-radius:12px;font-size:11px;white-space:nowrap;cursor:pointer;flex-shrink:0;color:#c8d8ff;font-weight:700}
.gChip.on{background:#ff9500!important;color:#111!important;border-color:#ff9500!important;font-weight:900}
#list{flex:1;background:#080d16;overflow:hidden;display:flex;flex-direction:column}
#grid{flex:1;overflow:auto;padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;grid-auto-rows:66px}
.item{display:flex;align-items:center;gap:6px;background:#13203a;border:1px solid #1e2e51;border-radius:8px;padding:4px 6px;cursor:pointer;height:66px;overflow:hidden;position:relative}
.item.on{border-color:#ff9500}
.logoBox{width:40px;height:40px;min-width:40px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:1px}
.logoBox img{width:100%;height:100%;object-fit:contain;background:#fff}
.info{flex:1;overflow:hidden;min-width:0}
.info b{font-size:11px;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:#fff;font-weight:800}
.info span{font-size:9px;color:#8aa0c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.favBtn{position:absolute;right:3px;bottom:3px;width:14px;height:14px;border:none;background:rgba(0,0,0,.4);border-radius:50%;color:#666;font-size:8px;cursor:pointer}
.favBtn.on{color:#ffcc33}
@media (min-width:900px){
#playerCol{height:52vh;min-height:340px;max-width:1100px;margin:0 auto;width:100%;border-left:1px solid #1c2b4a;border-right:1px solid #1c2b4a}
#idle img{object-fit:contain}
#list,#groupsWrap,.top,header,#epgBar{max-width:1100px;margin:0 auto;width:100%;border-left:1px solid #1c2b4a;border-right:1px solid #1c2b4a}
.gChip{font-size:13px!important;padding:8px 18px!important}
.top button{font-size:12px!important;padding:7px 16px!important}
}
.hidden{display:none!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99}
.box{background:#101b30;border:1px solid #22365e;width:340px;max-width:92vw;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box textarea{background:#0a1222;border:1px solid #22365e;color:#fff;padding:8px;border-radius:6px;width:100%;font-size:11px;min-height:60px}
</style>
</head>
<body>
<header><div class="logo"><img src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg" alt=""> Mirti TV</div><button id="setBtn" style="background:#d4b78f;color:#111;border:none;padding:4px 8px;border-radius:4px;font-weight:800;font-size:10px">AYAR</button></header>
<div class="top"><button data-tab="live" class="on" id="bLive">Canli</button><button data-tab="movie" id="bMovie">Film</button><button data-tab="series" id="bSeries">Dizi</button><button data-tab="radio" id="bRadio">Radyo</button><button data-tab="fav" id="bFav">Fav</button></div>
<div id="playerCol"><div id="player"><video id="video" controls playsinline style="width:100%;height:100%;display:none"></video><div id="idle"><img src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261017-WA0045.jpg" alt=""></div></div><div id="epgBar"><span id="epgNow">Hazir...</span></div></div>
<div id="groupsWrap"><div id="groups"></div></div>
<div id="list"><div id="grid"></div></div>
<div id="modal" class="hidden"><div class="box"><b style="font-size:12px">M3U Yukle</b><textarea id="m3uIn" placeholder="M3U linki"></textarea><div style="display:flex;gap:6px"><button id="loadBtn" style="flex:1;background:#d4b78f;color:#111;border:none;padding:8px;border-radius:6px;font-weight:800">YUKLE</button><button id="closeBtn" style="background:transparent;border:1px solid #33486f;color:#fff;padding:8px;border-radius:6px">KAPAT</button></div><button id="fixM3U" style="background:#ff3b30;color:#fff;border:none;padding:8px;border-radius:6px;font-size:10px">YAYIN GERI</button><div id="stat" style="font-size:9px;color:#8fb0ff"></div></div></div>
<script>
var M3U_URLS=["https://raw.githubusercontent.com/ipmirti68/-p/main/mirti68.m3u"];
var DEFAULT_LOGO="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
var channels=[],groupOrder=[],favs=[],curGroup=null,curTab="live",hls=null,curCh=null;
try{favs=JSON.parse(localStorage.getItem("mirti_fav")||"[]");}catch(e){favs=[];}
function $(id){return document.getElementById(id);}
function isFav(u){return favs.indexOf(u)>=0;}
function toggleFav(u){var i=favs.indexOf(u);if(i<0)favs.push(u);else favs.splice(i,1);try{localStorage.setItem("mirti_fav",JSON.stringify(favs));}catch(e){}renderGrid();renderGroups();}
function cleanGroup(g){var t=(g||"Genel").trim();t=t.replace(/\s+/g," ").trim();return t;}
function getType(g,u){var n=(g||"").toLowerCase();if(n.indexOf("dizi")>=0)return "series";if(n.indexOf("film")>=0)return "movie";if(n.indexOf("radyo")>=0||n.indexOf("radio")>=0)return "radio";if((u||"").indexOf(".mp4")>=0)return "movie";return "live";}
function parseM3U(t){
var list=[],seen={},newOrder=[],cur=null;
var lines=t.replace(/\r/g,"").split("\n");
for(var i=0;i<lines.length;i++){
var l=lines[i].trim();if(!l)continue;
if(l.toUpperCase().indexOf("#EXTINF")===0){
cur={};var lo=l.match(/tvg-logo="([^"]+)"/i);if(lo)cur.logo=lo[1];
var gr=l.match(/group-title="([^"]+)"/i);cur.group=cleanGroup(gr?gr[1]:"Genel");
var c=l.lastIndexOf(",");cur.title=c>=0?l.slice(c+1).trim():"Kanal";
if(!seen[cur.group]){seen[cur.group]=1;newOrder.push(cur.group);}
}else if(cur&&l.charAt(0)!=="#"){
var url=l.split("|")[0].trim().split(/\s+/)[0];
if(url.indexOf("http")===0){cur.url=url;cur.type=getType(cur.group,url);list.push(cur);}
cur=null;
}
}
newOrder.sort(function(a,b){return a.localeCompare(b,"tr");});
groupOrder=newOrder;return list;
}
function getFiltered(){
var list=[];for(var i=0;i<channels.length;i++){var c=channels[i];if(curTab==="fav"){if(isFav(c.url))list.push(c);}else if(c.type===curTab)list.push(c);}
if(curGroup){var f=[];for(var j=0;j<list.length;j++)if(list[j].group===curGroup)f.push(list[j]);list=f;}
return list;
}
function renderGroups(){
var gl=$("groups");if(!gl)return;gl.innerHTML="";
var has={};for(var j=0;j<channels.length;j++){var g=channels[j].group;if(!has[g])has[g]={live:0,movie:0,series:0,radio:0,fav:0};var t=channels[j].type;if(t==="live")has[g].live=1;else if(t==="movie")has[g].movie=1;else if(t==="series")has[g].series=1;else if(t==="radio")has[g].radio=1;if(isFav(channels[j].url))has[g].fav=1;}
for(var i=0;i<groupOrder.length;i++){
var g=groupOrder[i];var m=has[g];if(!m)continue;
var ok=false;if(curTab==="live"&&m.live)ok=true;else if(curTab==="movie"&&m.movie)ok=true;else if(curTab==="series"&&m.series)ok=true;else if(curTab==="radio"&&m.radio)ok=true;else if(curTab==="fav"&&m.fav)ok=true;
if(!ok)continue;
var div=document.createElement("div");div.className="gChip"+(g===curGroup?" on":"");div.textContent=g;
(function(gg){div.onclick=function(){curGroup=gg;renderGrid();renderGroups();};})(g);
gl.appendChild(div);
}
}
function renderGrid(){
var grid=$("grid");if(!grid)return;grid.innerHTML="";
var list=getFiltered();
if(list.length===0){var d=document.createElement("div");d.style.cssText="grid-column:1/-1;color:#888;padding:20px;text-align:center;font-size:11px";d.textContent=channels.length===0?"Liste bos - AYAR > YAYIN GERI":"Bu grupta kanal yok";grid.appendChild(d);return;}
for(var i=0;i<list.length;i++){
var ch=list[i];
var row=document.createElement("div");row.className="item"+(curCh&&curCh.url===ch.url?" on":"");
var logoBox=document.createElement("div");logoBox.className="logoBox";
var img=document.createElement("img");img.src=ch.logo||DEFAULT_LOGO;img.onerror=function(){this.src=DEFAULT_LOGO;};logoBox.appendChild(img);
var info=document.createElement("div");info.className="info";
var b=document.createElement("b");b.textContent=ch.title;
var sp=document.createElement("span");sp.textContent=ch.group;
info.appendChild(b);info.appendChild(sp);
var fav=document.createElement("button");fav.className="favBtn"+(isFav(ch.url)?" on":"");fav.textContent=isFav(ch.url)?"★":"☆";
(function(u){fav.onclick=function(e){e.stopPropagation();toggleFav(u);};})(ch.url);
row.appendChild(logoBox);row.appendChild(info);row.appendChild(fav);
(function(c){row.onclick=function(){play(c);};})(ch);
grid.appendChild(row);
}
var lc=0,mc=0,sc=0,rc=0;for(var k=0;k<channels.length;k++){if(channels[k].type==="live")lc++;else if(channels[k].type==="movie")mc++;else if(channels[k].type==="series")sc++;else if(channels[k].type==="radio")rc++;}
$("bLive").textContent="Canli "+lc;$("bMovie").textContent="Film "+mc;$("bSeries").textContent="Dizi "+sc;$("bRadio").textContent="Radyo "+rc;$("bFav").textContent="Fav "+favs.length;
}
function play(ch){
if(!ch||!ch.url)return;
curCh=ch;var v=$("video"),idle=$("idle");if(idle)idle.style.display="none";v.style.display="block";v.pause();
$("epgNow").textContent=ch.group+" | "+ch.title;
if(hls){try{hls.destroy();}catch(e){}hls=null;}
if(ch.url.indexOf(".m3u8")>=0){
if(Hls.isSupported()){hls=new Hls();hls.loadSource(ch.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){});});}
else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=ch.url;v.play();}
}else{v.src=ch.url;v.play().catch(function(){$("epgNow").textContent="VLC'de ac: "+ch.title;});}
renderGrid();
}
function findUlusal(){for(var i=0;i<groupOrder.length;i++)if(groupOrder[i].toLowerCase().indexOf("ulusal")>=0)return groupOrder[i];return groupOrder[0]||null;}
function loadFallback(){channels=[{title:"TRT 1",group:"ULUSAL",url:"https://tv-trt1.medya.trt.com.tr/master.m3u8",logo:DEFAULT_LOGO,type:"live"}];groupOrder=["ULUSAL"];curGroup="ULUSAL";curTab="live";renderGroups();renderGrid();$("epgNow").textContent="Yedek yayin";}
function loadM3U(idx){
if(idx==null)idx=0;if(idx>=M3U_URLS.length){loadFallback();return;}
$("epgNow").textContent="Yukleniyor "+(idx+1);
fetch(M3U_URLS[idx],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("http");return r.text();}).then(function(t){
if(t.length<100)throw new Error("bos");var p=parseM3U(t);if(p.length===0)throw new Error("0");channels=p;curGroup=findUlusal()||groupOrder[0];$("epgNow").textContent=channels.length+" kanal - v85 temiz";renderGroups();renderGrid();
}).catch(function(){loadM3U(idx+1);});
}
$("setBtn").onclick=function(){$("modal").classList.remove("hidden");};
$("closeBtn").onclick=function(){$("modal").classList.add("hidden");};
$("fixM3U").onclick=function(){loadFallback();$("modal").classList.add("hidden");};
var tabs=document.querySelectorAll(".top button");for(var i=0;i<tabs.length;i++){(function(btn){btn.addEventListener("click",function(){for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on");btn.classList.add("on");curTab=btn.getAttribute("data-tab");if(curTab==="live")curGroup=findUlusal();else curGroup=null;renderGroups();renderGrid();});})(tabs[i]);}
$("loadBtn").onclick=function(){var raw=$("m3uIn").value.trim();if(!raw)return;if(raw.indexOf("http")===0&&raw.indexOf("#EXTINF")<0){fetch(raw).then(function(r){return r.text();}).then(function(t){var p=parseM3U(t);channels=p;curGroup=findUlusal();renderGroups();renderGrid();$("modal").classList.add("hidden");});}else{var p=parseM3U(raw);for(var ii=0;ii<p.length;ii++){if(groupOrder.indexOf(p[ii].group)<0)groupOrder.push(p[ii].group);channels.push(p[ii]);}groupOrder.sort(function(a,b){return a.localeCompare(b,"tr");});renderGroups();renderGrid();$("modal").classList.add("hidden");}};
loadM3U(0);
</script>
</body>
</html>
