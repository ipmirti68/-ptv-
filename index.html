<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070b14;color:#e8e6df;font-family:Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

.top button[data-tab="movie"]{background:#1e2f4a;border-color:#2a5a7a}
.top button[data-tab="movie"].on{background:#007aff;color:#fff;border-color:#007aff}
.top button[data-tab="series"]{background:#2a204a;border-color:#5a3a8a}

#playerCol{height:36vh;min-height:180px;max-height:36vh;background:#000;position:relative;display:flex;flex-direction:column;flex-shrink:0}

/* LOGO DARALTILDI - ALTI ÜSTÜ BOŞLUK YOK */
.item{position:relative;display:flex;align-items:center;gap:6px;background:#13203a;border:1px solid #1e2e51;border-radius:8px;padding:4px 6px;cursor:pointer;height:68px;overflow:hidden;flex-shrink:0}

.info .epg1{font-size:10px;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:#c8d8ff;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;white-space:normal;max-height:22px;line-clamp:1}

.favBtn{position:absolute;right:2px;bottom:2px;width:16px;height:16px;min-width:16px;border:none;background:rgba(0,0,0,.3);border-radius:50%;color:#666;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.posterCard{background:#121e33;border:1px solid #1e2e51;border-radius:8px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;height:280px;position:relative}

.favBtnCard{position:absolute;top:4px;right:4px;width:18px;height:18px;background:rgba(0,0,0,.55);border-radius:50%;border:none;color:#888;font-size:9px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.favBtnCard.on{color:#ffcc33}
.hidden{display:none!important}
#radioInfo{position:absolute;bottom:30px;left:10px;right:10px;z-index:5;background:rgba(0,0,0,.7);padding:6px 10px;border-radius:8px;text-align:center;display:none}
#radioInfo b{font-size:11px;color:#ffcc33;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#radioInfo span{font-size:9px;color:#aaa}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:99}
.box{background:#101b30;border:1px solid #22365e;width:360px;max-width:92vw;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box input{background:#0a1222;border:1px solid #22365e;color:#fff;padding:8px;border-radius:6px;width:100%;font-size:11px}
#speedModal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;align-items:center;justify-content:center}
.speedBox{background:#fff;color:#111;width:360px;max-width:92vw;border-radius:12px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px}
.speedVal{font-size:42px;font-weight:300;color:#111;margin-top:-10px}
</style>

<body>
<header><div class="logo"><img src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg">Mırtı TV</div><div style="display:flex;align-items:center;gap:4px"><span id="netSpeed" style="font-size:7px;background:#101c33;border:1px solid #1e2f52;padding:3px 6px;border-radius:8px;color:#7ec8ff;cursor:pointer;font-weight:700">Net: Ölçülüyor...</span><button id="setBtn" style="background:#d4b78f;color:#111;border:none;padding:3px 8px;border-radius:4px;font-weight:800;font-size:10px">AYAR</button></div></header>
<div class="top"><button data-tab="live" class="on" id="bLive">📺 Canlı</button><button data-tab="movie" id="bMovie">🎬 Film</button><button data-tab="series" id="bSeries">🎞️ Dizi</button><button data-tab="radio" id="bRadio">📻 Radyo</button><button data-tab="fav" id="bFav">⭐ Fav</button></div>
<div id="playerCol"><div id="player"><video id="video" controls playsinline preload="metadata" style="width:100%;height:100%;display:none"></video><div id="idle"><img id="idleImg" src="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261017-WA0045.jpg"><div id="loadWrap"><div id="loadBar"><div id="loadFill"></div></div><div id="loadText">Başlıyor...</div></div><div id="radioInfo"><b id="rTitle"></b><span id="rSub">📻 Canlı Radyo</span></div></div></div><div id="epgBar"><span style="color:#7ec8ff">EPG:</span><span id="epgNow">Başlıyor...</span></div></div>

<div style="width:260px;height:120px"><svg viewBox="0 0 200 120"><path d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#e5e5e5" stroke-width="12" stroke-linecap="round"/><path id="arc" d="M20 100 A80 80 0 0 1 180 100" fill="none" stroke="#00d2e0" stroke-width="12" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"/><line id="needle" x1="100" y1="100" x2="40" y2="40" stroke="#333" stroke-width="3" stroke-linecap="round"/></svg></div>

</div></div>

<div id="modal" class="hidden"><div class="box"><b style="font-size:13px">M3U / EPG Yükle</b><input id="m3uIn" placeholder="M3U Linki"><input id="epgIn" placeholder="EPG Linki"><input type="file" id="fileIn" accept=".m3u,.m3u8,.txt,.xml"><div style="display:flex;gap:6px"><button id="loadBtn" style="flex:1;background:#d4b78f;color:#111;border:none;padding:10px;border-radius:8px;font-weight:800">YÜKLE</button><button id="closeBtn" style="background:transparent;border:1px solid #33486f;color:#fff;padding:10px;border-radius:8px">KAPAT</button></div><div id="stat" style="font-size:10px;color:#8fb0ff;white-space:pre-wrap;max-height:120px;overflow:auto"></div></div></div>

<script>
var M3U_FILES=["mırtı68.m3u","mirti68.m3u","Mırtı68.m3u"];
var M3U_BASES=[
"https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/",
"https://raw.githubusercontent.com/ipmirti68/-p/main/",
"https://cdn.jsdelivr.net/gh/ipmirti68/-p@main/",
"https://cdn.jsdelivr.net/gh/ipmirti68/-p/main/"
];
var M3U_URLS=[];
for(var bi=0;bi<M3U_BASES.length;bi++){ for(var fi=0;fi<M3U_FILES.length;fi++){ M3U_URLS.push(M3U_BASES[bi]+encodeURIComponent(M3U_FILES[fi])); } }
M3U_URLS.push("https://api.allorigins.win/raw?url="+encodeURIComponent("https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/m%C4%B1rt%C4%B168.m3u"));
var EPG_URL="https://raw.githubusercontent.com/ipmirti68/epg/refs/heads/main/epg.xml";
var DEFAULT_LOGO="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
var SPEED_TEST_URL="https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg";
// Radyoda her seferde farklı resim
var RADIO_IMAGES=[
"https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261017-WA0045.jpg",
"https://raw.githubusercontent.com/ipmirti68/-ptv-/refs/heads/main/IMG-20261025-WA5328.jpg",
"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=600",
"https://images.unsplash.com/photo-1478737270239-2f02b77fc618?w=600",
"https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600"
];
var channels=[],epg={},curGroup=null,curTab="live",hls=null,groupOrder=[],favs=[],curCh=null,radioTimer=null,radioImgIdx=0;
try{favs=JSON.parse(localStorage.getItem("mirti_fav")||"[]");}catch(e){favs=[];}

function $(id){return document.getElementById(id);}
function setLoad(p,t){ var f=$("loadFill"), tx=$("loadText"); if(f)f.style.width=p+"%"; if(tx)tx.textContent="%"+p+" "+t; var en=$("epgNow"); if(en)en.textContent=t; }
function saveFav(){try{localStorage.setItem("mirti_fav",JSON.stringify(favs));}catch(e){}}
function isFav(url){return favs.indexOf(url)!=-1;}
function toggleFav(url){ var i=favs.indexOf(url); if(i==-1)favs.push(url); else favs.splice(i,1); saveFav(); renderGrid(); renderGroups(); }
function norm(s){
  if(!s)return "";
  var t=s+""; t=t.replace(/İ/g,"i").replace(/I/g,"i");
  t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  t=t.toLowerCase();
  t=t.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
  return t;
}
function getTypeByGroup(g,url,raw){
  var n=norm(g);
  var r=(raw||"").toLowerCase();
  if(r.indexOf('radio="true"')!=-1) return "radio";
  if(n.indexOf("radyo")!=-1) return "radio";
  if(n.indexOf("radio")!=-1) return "radio";
  if(n.indexOf("sinema")!=-1) return "live";
  if(n.indexOf("yerli dizi")!=-1) return "series";
  if(n.indexOf("guncel dizi")!=-1) return "series";
  if(n.indexOf("guncel diziler")!=-1) return "series";
  if(n.indexOf("dizi")!=-1) return "series";
  if(n.indexOf("sezon")!=-1) return "series";
  if(n.indexOf("bolum")!=-1) return "series";
  if(n.indexOf("series")!=-1) return "series";
  if(n.indexOf("film")!=-1) return "movie";
  if(n.indexOf("movie")!=-1) return "movie";
  if(n.indexOf("vod")!=-1) return "movie";
  if(n.indexOf("sineturk")!=-1) return "movie";
  if(n.indexOf("yesilcam")!=-1) return "movie";
  if(n.indexOf("turk filmi")!=-1) return "movie";
  if(n.indexOf("kemal")!=-1 && n.indexOf("sunal")!=-1) return "movie";
  var u=(url||"").toLowerCase();
  if((u.indexOf(".mp4")!=-1 || u.indexOf(".mkv")!=-1) && n.indexOf("dizi")==-1 && n.indexOf("sinema")==-1 && n.indexOf("radyo")==-1) return "movie";
  return "live";
}
function parseM3U(t){
  var list=[]; var seen={}; groupOrder=[];
  t=t.replace(/\r/g,"");
  var lines=t.split("\n");
  var cur=null, curLine="";
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l)continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; curLine=l;
      var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo)cur.logo=lo[1];
      var id=l.match(/tvg-id="([^"]+)"/i); if(id)cur.tvgId=id[1];
      var gr=l.match(/group-title="([^"]+)"/i); cur.group=gr?gr[1].trim():"Genel";
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1);
      if(!seen[cur.group]){seen[cur.group]=1; groupOrder.push(cur.group);}
    }else{
      if(cur && l.charAt(0)!="#"){
        var url=l.split("|")[0].trim();
        cur.url=url;
        cur.type=getTypeByGroup(cur.group, url, curLine);
        cur.rawLine=curLine;
        list.push(cur); cur=null; curLine="";
      }
    }
  }
  return list;
}
function parseEPG(xmlText){
  try{
    var p=new DOMParser(), d=p.parseFromString(xmlText,"text/xml"), m={};
    var progs=d.querySelectorAll("programme");
    progs.forEach(function(pr){
      var ch=pr.getAttribute("channel");
      var st=pr.getAttribute("start");
      var en=pr.getAttribute("stop");
      var ti=pr.querySelector("title"); var title=ti?ti.textContent:"";
      if(!m[ch])m[ch]=[];
      m[ch].push({title:title,start:st,stop:en});
    });
    for(var k in m){ m[k].sort(function(a,b){ if(!a.start||!b.start)return 0; return a.start.localeCompare(b.start); }); }
    return m;
  }catch(e){return {};}
}
function parseEPGDate(s){
  if(!s)return null;
  try{ var y=s.substr(0,4), mo=s.substr(4,2)-1, d=s.substr(6,2), h=s.substr(8,2), mi=s.substr(10,2), sec=s.substr(12,2); return new Date(y,mo,d,h,mi,sec); }catch(e){return null;}
}
function getEPGNowNext(ch){
  if(!ch)return {now:null,next:null};
  var list=null;
  if(ch.tvgId && epg[ch.tvgId])list=epg[ch.tvgId];
  else if(epg[ch.title])list=epg[ch.title];
  else{ var low=norm(ch.title); for(var k in epg){if(norm(k)==low){list=epg[k];break;}} }
  if(!list||!list.length)return {now:null,next:null};
  var now=new Date();
  var nowProg=null,nextProg=null;
  for(var i=0;i<list.length;i++){
    var p=list[i]; var st=parseEPGDate(p.start); var en=parseEPGDate(p.stop);
    if(st&&en){ if(now>=st&&now<en){nowProg=p; if(i+1<list.length)nextProg=list[i+1]; break;} if(now<st && !nowProg){nextProg=p; if(i>0)nowProg=list[i-1]; break;} }
    else{ if(i==0)nowProg=p; if(i==1)nextProg=p; }
  }
  if(!nowProg&&list.length){nowProg=list[0]; if(list.length>1)nextProg=list[1];}
  return {now:nowProg,next:nextProg};
}
function getFiltered(){
  var list=[];
  for(var i=0;i<channels.length;i++){ var c=channels[i]; if(curTab=="fav"){if(isFav(c.url))list.push(c);} else if(c.type==curTab)list.push(c); }
  if(curGroup){ var f=[]; for(var j=0;j<list.length;j++) if(list[j].group==curGroup)f.push(list[j]); list=f; }
  return list;
}
function renderGroups(){
  var gl=$("groups"); if(!gl)return; gl.innerHTML="";
  for(var i=0;i<groupOrder.length;i++){
    var g=groupOrder[i];
    var has=false, cnt=0;
    for(var j=0;j<channels.length;j++){ if(channels[j].group==g){ if(curTab=="fav"){if(isFav(channels[j].url)){has=true;cnt++;}} else if(channels[j].type==curTab){has=true;cnt++;} } }
    if(!has)continue;
    var div=document.createElement("div"); div.className="gChip"+(g==curGroup?" on":""); div.textContent=g+" "+cnt;
    div.onclick=(function(gg){return function(){
      // Radyo çalıyorsa başka gruba gidince kapansın
      if(curCh && curCh.type=="radio"){
        var willBeRadio=false;
        for(var k=0;k<channels.length;k++){ if(channels[k].group==gg && channels[k].type=="radio"){willBeRadio=true;break;} }
        if(!willBeRadio){ stopRadio(); }
      }
      curGroup=gg; renderGrid(); renderGroups();
    };})(g);
    gl.appendChild(div);
  }
  setTimeout(function(){var el=document.querySelector(".gChip.on"); if(el)el.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});},200);
}
function renderGrid(){
  var grid=$("grid"); if(!grid)return; grid.innerHTML="";
  var list=getFiltered();
  if(list.length==0 && channels.length==0){ var d=document.createElement("div"); d.style.cssText="color:#ff9a3d;padding:20px;text-align:center;font-size:11px"; d.innerHTML="Liste boş<br><small style='color:#aaa'>"+M3U_URLS.length+" link denendi</small>"; grid.appendChild(d); return; }
  if(list.length==0 && curTab=="fav"){ var d2=document.createElement("div"); d2.style.cssText="color:#888;padding:20px;text-align:center;font-size:11px"; d2.textContent="Fav yok - yıldız tıkla"; grid.appendChild(d2); return; }
  if(curTab=="movie" || curTab=="series"){
    grid.className="poster";
    for(var i=0;i<list.length;i++){
      var ch=list[i]; var card=document.createElement("div"); card.className="posterCard";
      var p=document.createElement("div"); p.className="posterImg";
      var img=document.createElement("img"); img.src=ch.logo ? ch.logo : DEFAULT_LOGO; img.loading="lazy"; img.onerror=function(){this.onerror=null; this.src=DEFAULT_LOGO;}; p.appendChild(img);
      var favBtn=document.createElement("button"); favBtn.className="favBtnCard"+(isFav(ch.url)?" on":""); favBtn.textContent=isFav(ch.url)?"★":"☆"; favBtn.onclick=(function(url){return function(ev){ev.stopPropagation(); toggleFav(url);};})(ch.url); p.appendChild(favBtn);
      var m=document.createElement("div"); m.className="posterTitle";
      var epgNN=getEPGNowNext(ch); var t1=document.createElement("div"); t1.textContent=ch.title; var t2=document.createElement("small");
      // EPG 2 satır
      if(epgNN.now) t2.textContent=epgNN.now.title;
      else if(epgNN.next) t2.textContent=epgNN.next.title;
      else t2.textContent=ch.group;
      m.appendChild(t1); m.appendChild(t2);
      card.appendChild(p); card.appendChild(m); card.onclick=(function(c){return function(){play(c);};})(ch); grid.appendChild(card);
    }
  }else{
    grid.className="live";
    for(var j=0;j<list.length;j++){
      var ch2=list[j]; var row=document.createElement("div"); row.className="item"+(curCh && curCh.url==ch2.url?" on":""); if(ch2.group && norm(ch2.group).indexOf("ulusal")!=-1)row.className+=" ulusal";
      var logoBox=document.createElement("div"); logoBox.className="logoBox"; var img2=document.createElement("img"); img2.src=ch2.logo ? ch2.logo : DEFAULT_LOGO; img2.onerror=function(){this.onerror=null; this.src=DEFAULT_LOGO;}; logoBox.appendChild(img2);
      var info=document.createElement("div"); info.className="info";
      var b=document.createElement("b"); b.textContent=ch2.title;
      var epgNN2=getEPGNowNext(ch2);
      var s=document.createElement("div"); s.className="epg1";
      var nxt=document.createElement("div"); nxt.className="epg2";
      // EPG 2 satır - Şimdi Sonra yazmadan direkt
      if(epgNN2.now){
        s.textContent=epgNN2.now.title;
        if(epgNN2.next) nxt.textContent=epgNN2.next.title;
        else nxt.textContent="";
      }else{
        s.textContent=ch2.group;
        nxt.textContent="";
      }
      info.appendChild(b); info.appendChild(s); if(nxt.textContent) info.appendChild(nxt);
      var favBtn2=document.createElement("button"); favBtn2.className="favBtn"+(isFav(ch2.url)?" on":""); favBtn2.textContent=isFav(ch2.url)?"★":"☆";
      favBtn2.onclick=(function(url){return function(ev){ev.stopPropagation(); toggleFav(url);};})(ch2.url);
      row.appendChild(logoBox); row.appendChild(info); row.appendChild(favBtn2);
      row.onclick=(function(c){return function(){play(c);};})(ch2);
      grid.appendChild(row);
    }
  }
  var lc=0,mc=0,sc=0,rc=0; for(var k=0;k<channels.length;k++){if(channels[k].type=="live")lc++; else if(channels[k].type=="movie")mc++; else if(channels[k].type=="series")sc++; else if(channels[k].type=="radio")rc++;}
  if($("bLive"))$("bLive").innerHTML="📺 Canlı "+lc; if($("bMovie"))$("bMovie").innerHTML="🎬 Film "+mc; if($("bSeries"))$("bSeries").innerHTML="🎞️ Dizi "+sc; if($("bRadio"))$("bRadio").innerHTML="📻 Radyo "+rc; if($("bFav"))$("bFav").innerHTML="⭐ Fav "+favs.length;
}
function stopRadio(){
  var v=$("video");
  if(v){ v.pause(); v.src=""; v.style.display="none"; }
  if(hls){try{hls.destroy();}catch(e){} hls=null;}
  if(radioTimer){ clearInterval(radioTimer); radioTimer=null; }
  var idle=$("idle"); if(idle){ idle.style.display="flex"; idle.classList.remove("radioMode"); }
  var rInfo=$("radioInfo"); if(rInfo) rInfo.style.display="none";
  var idleImg=$("idleImg"); if(idleImg) idleImg.src=RADIO_IMAGES[0];
  curCh=null;
  if($("epgNow")) $("epgNow").textContent="Radyo durdu";
}
function startRadioImages(ch){
  var idleImg=$("idleImg"); var idle=$("idle");
  if(!idleImg||!idle)return;
  radioImgIdx=Math.floor(Math.random()*RADIO_IMAGES.length);
  idleImg.src=RADIO_IMAGES[radioImgIdx];
  idle.classList.add("radioMode");
  var rInfo=$("radioInfo"); if(rInfo){ rInfo.style.display="block"; $("rTitle").textContent=ch.title; $("rSub").textContent="📻 "+ch.group; }
  if(radioTimer) clearInterval(radioTimer);
  radioTimer=setInterval(function(){
    radioImgIdx=(radioImgIdx+1)%RADIO_IMAGES.length;
    idleImg.style.opacity="0.2";
    setTimeout(function(){ idleImg.src=RADIO_IMAGES[radioImgIdx]; idleImg.style.opacity="1"; },200);
  },4000);
}
function play(ch){
  // Radyo ise farklı resim her seferde
  if(ch.type=="radio"){
    var v=$("video"), idle=$("idle");
    curCh=ch;
    if(idle)idle.style.display="flex";
    if(v){ v.style.display="none"; v.pause(); v.currentTime=0; }
    if($("epgNow")) $("epgNow").textContent="📻 "+ch.title+" | "+ch.group;
    if(hls){try{hls.destroy();}catch(e){} hls=null;}
    startRadioImages(ch);
    var aud=$("video"); // audio olarak video kullanıyoruz ama gizli
    // Radyo için ayrı audio elementi gibi davran
    if(ch.url.indexOf(".m3u8")!=-1){
      if(Hls.isSupported()){
        hls=new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(aud);
        hls.on(Hls.Events.MANIFEST_PARSED,function(){ aud.play().catch(function(){}); });
      }else{ aud.src=ch.url; aud.play().catch(function(){}); }
    }else{ aud.src=ch.url; aud.play().catch(function(){}); aud.style.display="none"; }
    renderGrid();
    return;
  }
  // Normal TV - radyo çalıyorsa durdur
  if(curCh && curCh.type=="radio"){ stopRadio(); }
  if(radioTimer){ clearInterval(radioTimer); radioTimer=null; }
  var idle2=$("idle"); if(idle2){ idle2.classList.remove("radioMode"); }
  var rInfo2=$("radioInfo"); if(rInfo2) rInfo2.style.display="none";
  curCh=ch;
  var v=$("video"), idle=$("idle");
  if(idle)idle.style.display="none";
  if(v){v.style.display="block"; v.removeAttribute("hidden"); v.pause(); v.currentTime=0;}
  var epgNN=getEPGNowNext(ch);
  if($("epgNow")){ if(epgNN.now&&epgNN.next)$("epgNow").textContent=epgNN.now.title+" | "+epgNN.next.title+" | "+ch.title; else if(epgNN.now)$("epgNow").textContent=epgNN.now.title+" | "+ch.title; else $("epgNow").textContent=ch.group+" | "+ch.title; }
  if(hls){try{hls.destroy();}catch(e){} hls=null;}
  if(ch.url.indexOf(".m3u8")!=-1){
    if(Hls.isSupported()){
      hls=new Hls({enableWorker:true, lowLatencyMode:false});
      hls.loadSource(ch.url);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,function(){ v.play().catch(function(){}); });
      hls.on(Hls.Events.ERROR,function(event,data){ if(data.fatal){ try{hls.destroy();}catch(e){} v.src=ch.url; v.play().catch(function(){}); }});
    }else if(v.canPlayType('application/vnd.apple.mpegurl')){ v.src=ch.url; v.play().catch(function(){}); }
  }else{ v.src=ch.url; v.play().catch(function(){}); }
  renderGrid();
}
function findUlusalGroup(){ for(var i=0;i<groupOrder.length;i++){ var g=groupOrder[i]; if(norm(g).indexOf("ulusal")!=-1)return g; } return null; }
function measureSpeed(url){ return new Promise(function(resolve,reject){ var start=performance.now(); fetch(url+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error("HTTP "+r.status); return r.blob(); }).then(function(blob){ var end=performance.now(); var durationMs=end-start; var durationSec=durationMs/1000; if(durationSec<0.01)durationSec=0.01; var bytes=blob.size; var mbps=(bytes*8/1000000)/durationSec; resolve({mbps:mbps,ms:durationMs,bytes:bytes}); }).catch(function(e){reject(e);}); }); }
function doSpeedTest(){ var arc=$("arc"), needle=$("needle"), num=$("speedNum"), pingEl=$("pingVal"), downEl=$("downVal"), sizeEl=$("sizeVal"), infoEl=$("speedInfo"); if(!arc)return; num.textContent="..."; pingEl.textContent="..."; downEl.textContent="..."; if(sizeEl)sizeEl.textContent="..."; if(infoEl)infoEl.textContent="Ölçülüyor..."; measureSpeed(SPEED_TEST_URL).then(function(res){ var mbps=res.mbps; pingEl.textContent=Math.round(res.ms); downEl.textContent=mbps.toFixed(1); if(sizeEl)sizeEl.textContent=Math.round(res.bytes/1024)+" KB"; num.textContent=mbps.toFixed(2); if(infoEl)infoEl.textContent="Gerçek: "+Math.round(res.bytes/1024)+" KB "+Math.round(res.ms)+"ms"; $("netSpeed").textContent="Net: "+mbps.toFixed(1)+" Mbps"; var pct=Math.min(mbps,100); var dash=251-pct/100*251; arc.style.strokeDashoffset=dash; var angle=-90+ (pct/100*180); var rad=angle*Math.PI/180; var x=100+60*Math.cos(rad); var y=100+60*Math.sin(rad); needle.setAttribute("x2",x); needle.setAttribute("y2",y); }).catch(function(e){ pingEl.textContent="hata"; if(infoEl)infoEl.textContent="Hata: "+e.message; num.textContent="0.00"; }); }
function loadM3UFromUrls(idx){ if(idx==null)idx=0; if(idx>=M3U_URLS.length){ setLoad(0,"Tüm linkler başarısız - AYAR'a bas"); $("stat").textContent="Denenen linkler:\n"+M3U_URLS.join("\n"); $("modal").classList.remove("hidden"); return; } var url=M3U_URLS[idx]; setLoad(5+Math.floor(idx/M3U_URLS.length*30),"Deneniyor "+(idx+1)+"/"+M3U_URLS.length); $("epgNow").textContent="Deneniyor "+(idx+1)+"/"+M3U_URLS.length; fetch(url,{cache:"no-store"}).then(function(r){ if(!r.ok)throw new Error("HTTP "+r.status); return r.text(); }).then(function(t){ if(t.length<100)throw new Error("boş "+t.length); setLoad(50,t.length+" bayt - ayrılıyor"); channels=parseM3U(t); if(channels.length==0)throw new Error("0 kanal bulundu"); var ul=findUlusalGroup(); if(ul){curGroup=ul; setLoad(70,"Ulusal: "+ul+" - "+channels.length+" kanal");} else{curGroup=groupOrder[0]; setLoad(70,channels.length+" kanal");} renderGroups(); renderGrid(); setLoad(80,"EPG yükleniyor..."); fetch(EPG_URL).then(function(re){return re.text();}).then(function(xe){ epg=parseEPG(xe); var keys=Object.keys(epg); setLoad(100,keys.length+" EPG | "+channels.length+" kanal - Ulusal seçili"); setTimeout(function(){var lw=$("loadWrap"); if(lw)lw.style.display="none";},800); renderGrid(); }).catch(function(e){setLoad(90,channels.length+" kanal - Ulusal seçili"); renderGrid(); var lw=$("loadWrap"); if(lw)lw.style.display="none";}); }).catch(function(e){ setLoad(3,"Link "+(idx+1)+" hata: "+e.message); setTimeout(function(){loadM3UFromUrls(idx+1);},400); }); }
function init(){
  setLoad(5,"Başlıyor...");
  $("setBtn").onclick=function(){$("modal").classList.remove("hidden");};
  $("closeBtn").onclick=function(){$("modal").classList.add("hidden");};
  $("leftArrow").onclick=function(){$("groups").scrollBy({left:-140,behavior:"smooth"});};
  $("rightArrow").onclick=function(){$("groups").scrollBy({left:140,behavior:"smooth"});};
  $("netSpeed").onclick=function(){$("speedModal").classList.remove("hidden"); doSpeedTest();};
  $("closeSpeed").onclick=function(){$("speedModal").classList.add("hidden");};
  $("startTest").onclick=function(){doSpeedTest();};
  var tabs=document.querySelectorAll(".top button");
  for(var i=0;i<tabs.length;i++){ tabs[i].addEventListener("click",(function(btn){return function(){
    var newTab=btn.dataset.tab;
    // Radyo çalıyorsa başka gruba (Canlı/Film/Dizi/Fav) gidince kapansın
    if(curCh && curCh.type=="radio" && newTab!="radio" && newTab!="fav"){
      var isRadioTab = newTab=="radio";
      if(!isRadioTab){ stopRadio(); }
    }
    for(var j=0;j<tabs.length;j++)tabs[j].classList.remove("on"); btn.classList.add("on"); curTab=newTab; if(curTab=="live"){var ul=findUlusalGroup(); if(ul)curGroup=ul; else curGroup=null;} else curGroup=null; renderGroups(); renderGrid();
  };})(tabs[i])); }
  $("loadBtn").onclick=function(){ var m3u=$("m3uIn").value.trim(); if(m3u){ setLoad(20,"Elle yükleniyor..."); fetch(m3u).then(function(r){return r.text();}).then(function(t){ var add=parseM3U(t); channels=add; var ul=findUlusalGroup(); if(ul)curGroup=ul; renderGroups(); renderGrid(); setLoad(100,add.length+" kanal"); $("modal").classList.add("hidden"); var lw=$("loadWrap"); if(lw)lw.style.display="none"; }).catch(function(e){$("stat").textContent="Hata: "+e.message;}); } };
  $("fileIn").addEventListener("change",function(e){ var file=e.target.files[0]; if(!file)return; var reader=new FileReader(); reader.onload=function(ev){ var txt=ev.target.result; if(file.name.endsWith(".xml")){var newEpg=parseEPG(txt); for(var k in newEpg)epg[k]=newEpg[k]; $("stat").textContent="EPG ok"; renderGrid();} else{var add=parseM3U(txt); channels=add; var ul=findUlusalGroup(); if(ul)curGroup=ul; renderGroups(); renderGrid(); setLoad(100,"Dosyadan "+add.length+" kanal"); $("modal").classList.add("hidden"); var lw=$("loadWrap"); if(lw)lw.style.display="none";} }; reader.readAsText(file); });
  loadM3UFromUrls(0);
  setTimeout(function(){doSpeedTest();},1200);
}
init();
</script>
