<script>
var M3U_URL="https://raw.githubusercontent.com/ipmirti68/-p/refs/heads/main/m%C4%B1rt%C4%B168.m3u";
var EPG_URL="https://raw.githubusercontent.com/ipmirti68/epg/refs/heads/main/epg.xml";
var channels=[],epg={},curGroup=null,curTab="live",hls=null,groupOrder=[],favs=[],curCh=null;
try{favs=JSON.parse(localStorage.getItem("mirti_fav")||"[]");}catch(e){favs=[];}

function $(id){return document.getElementById(id);}
function setLoad(p,t){
  var f=$("loadFill"), tx=$("loadText");
  if(f)f.style.width=p+"%";
  if(tx)tx.textContent="%"+p+" "+t;
  var en=$("epgNow");
  if(en)en.textContent=t;
}
function saveFav(){try{localStorage.setItem("mirti_fav",JSON.stringify(favs));}catch(e){}}
function isFav(url){return favs.indexOf(url)!=-1;}
function toggleFav(url){
  var i=favs.indexOf(url);
  if(i==-1)favs.push(url); else favs.splice(i,1);
  saveFav(); renderGrid(); renderGroups();
}
function norm(s){
  if(!s)return "";
  var t=s+"";
  t=t.replace(/İ/g,"i").replace(/I/g,"i");
  t=t.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  t=t.toLowerCase();
  t=t.replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c");
  return t;
}
function isSeriesGroup(g){
  var n=norm(g);
  if(n.indexOf("yerli dizi")!=-1)return true;
  if(n.indexOf("guncel dizi")!=-1)return true;
  if(n.indexOf("guncel diziler")!=-1)return true;
  if(n.indexOf("dizi")!=-1)return true;
  if(n.indexOf("sezon")!=-1)return true;
  if(n.indexOf("bolum")!=-1)return true;
  if(n.indexOf("series")!=-1)return true;
  return false;
}
function isMovieGroup(g,url){
  var n=norm(g);
  var u=(url||"").toLowerCase();
  if(n.indexOf("yerli dizi")!=-1)return false;
  if(n.indexOf("guncel dizi")!=-1)return false;
  if(n.indexOf("guncel diziler")!=-1)return false;
  if(n.indexOf("dizi")!=-1)return false;
  if(n.indexOf("sezon")!=-1)return false;
  if(n.indexOf("bolum")!=-1)return false;
  if(n.indexOf("canli")!=-1)return false;
  if(n.indexOf("live")!=-1)return false;
  if(n.indexOf("ulusal")!=-1)return false;
  if(n.indexOf("haber")!=-1)return false;
  if(n.indexOf("spor")!=-1)return false;
  if(u.indexOf(".mp4")!=-1)return true;
  if(u.indexOf(".mkv")!=-1)return true;
  if(n.indexOf("film")!=-1)return true;
  if(n.indexOf("movie")!=-1)return true;
  if(n.indexOf("sineturk")!=-1)return true;
  if(n.indexOf("kemal")!=-1)return true;
  if(n.indexOf("sunal")!=-1)return true;
  if(n.indexOf("yesilcam")!=-1)return true;
  if(n.indexOf("turk filmi")!=-1)return true;
  if(n.indexOf("vod")!=-1)return true;
  if(n.indexOf("sinema")!=-1)return true;
  return false;
}
function parseM3U(t){
  var list=[]; var seen={}; groupOrder=[];
  t=t.replace(/\r/g,"");
  var lines=t.split("\n");
  var cur=null, curLine="";
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(!l)continue;
    if(l.toUpperCase().indexOf("#EXTINF")==0){
      cur={}; curLine=l;
      var lo=l.match(/tvg-logo="([^"]+)"/i); if(lo)cur.logo=lo[1];
      var id=l.match(/tvg-id="([^"]+)"/i); if(id)cur.tvgId=id[1];
      var gr=l.match(/group-title="([^"]+)"/i); cur.group=gr?gr[1].trim():"Genel";
      var c=l.lastIndexOf(","); cur.title=c!=-1?l.slice(c+1).trim():"Kanal "+(list.length+1);
      if(!seen[cur.group]){seen[cur.group]=1; groupOrder.push(cur.group);}
    }else{
      if(cur && l.charAt(0)!="#"){
        var url=l.split("|")[0].trim();
        cur.url=url;
        var g=cur.group||"";
        var type="live";
        if(curLine.indexOf('radio="true"')!=-1)type="radio";
        else if(isSeriesGroup(g))type="series";
        else if(isMovieGroup(g,url))type="movie";
        else type="live";
        cur.type=type; cur.rawLine=curLine;
        list.push(cur); cur=null; curLine="";
      }
    }
  }
  return list;
}
function parseEPG(xmlText){
  try{
    var p=new DOMParser(), d=p.parseFromString(xmlText,"text/xml"), m={};
    var progs=d.querySelectorAll("programme");
    progs.forEach(function(pr){
      var ch=pr.getAttribute("channel");
      var
