name: MIRTI68 DiziKorea M3U Güncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "20 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python kod kontrolü
        run: |
          python -m py_compile dizikorea.py

      - name: DiziKorea listesini oluştur
        run: |
          python dizikorea.py

      - name: M3U dosyasını GitHub'a kaydet
        run: |
          git config user.name "MIRTI68 Bot"
          git config user.email "bot@users.noreply.github.com"
          git add dizikorea.m3u dizikorea.m3u.bak
          git diff --cached --quiet || git commit -m "DiziKorea M3U güncellendi"
          git push
